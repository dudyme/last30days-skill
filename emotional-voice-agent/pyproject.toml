[project]
name = "emotional-voice-agent"
version = "0.1.0"
description = "Emotional voice agent: Claude conversation brain + Cartesia expressive TTS"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "cartesia>=2.0",
]

[project.optional-dependencies]
audio = [
    "sounddevice>=0.4",
    "numpy>=1.26",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
voice-agent = "voice_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voice_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
